<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>Fitness OS · MVP</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#ecf2ff;background:#0b1220}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.app{display:flex;min-height:100vh}.side{width:220px;flex-shrink:0;border-right:1px solid #26334b;padding:26px 12px;background:#101b2d}.logo{font-weight:800;font-size:20px;margin:3px 12px 30px;color:#bcd8ff}.nav{display:flex;flex-direction:column;gap:7px}.nav button,.tabs button{border:0;background:transparent;color:#9fb0ca;text-align:left;padding:13px;border-radius:12px}.nav button.active,.tabs button.active{background:#233b60;color:#fff}.main{width:100%;max-width:1280px;margin:auto;padding:30px 28px 95px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:25px}h1{font-size:27px;margin:0}h2{font-size:18px;margin:0 0 15px}h3{font-size:15px;margin:0 0 12px}.muted,.small{color:#9fb0ca}.small{font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}.card{background:#17243a;border:1px solid #293b55;border-radius:16px;padding:18px;min-width:0}.kpi{font-size:27px;font-weight:760;margin:9px 0 4px}.bar{height:9px;border-radius:12px;background:#33435c;overflow:hidden;margin-top:9px}.fill{height:100%;background:#5a9bff}.protein{background:#38bdf8}.carbs{background:#eaaa43}.fat{background:#ae91f6}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.stack{display:flex;flex-direction:column;gap:12px}.btn{background:#3678e7;color:white;border:0;border-radius:10px;padding:11px 14px;font-weight:650}.secondary{background:#2a3b54}.danger{background:#8a3450}.ghost{background:transparent;border:1px solid #41526c}.pill{background:#273a54;color:#bbd1ef;border-radius:30px;padding:5px 9px;font-size:12px}input,select,textarea{background:#0f1b2d;border:1px solid #40516b;border-radius:9px;color:#f4f6ff;padding:10px;min-width:0;width:100%}label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#bbcae0}input[type=checkbox]{width:19px;height:19px;accent-color:#468afa}.formrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.item{border-top:1px solid #304159;padding:12px 0}.item:first-child{border-top:0}.bottom{display:none}.mealgrid{display:grid;grid-template-columns:80px repeat(7,minmax(90px,1fr));gap:5px;overflow:auto}.mealcell{border:1px solid #35465b;border-radius:9px;background:#202f46;padding:8px;min-height:64px;cursor:pointer;font-size:12px;text-align:left;color:#e4eeff}.mealhead{color:#9fb0ca;font-size:12px;padding:10px 2px}.setrow{display:grid;grid-template-columns:40px 1fr 1fr 45px;align-items:center;gap:8px;margin-bottom:8px}.notice{background:#223553;padding:10px 12px;border-radius:9px;font-size:13px;color:#cbdfff}.hidden{display:none!important}.wide{grid-column:1/-1}.mark{color:#55cd8f}.chart{display:flex;gap:8px;height:100px;align-items:end}.chartcol{flex:1;background:#4d8deb;border-radius:5px 5px 0 0;min-height:4px}.chartlabel{text-align:center;color:#9fb0ca;font-size:11px}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{border:1px solid #34445a;background:#14243a;padding:10px;border-radius:8px;text-align:center;font-size:12px}.day.active{border-color:#639cff;background:#28446a}@media(max-width:850px){.side{display:none}.main{padding:21px 13px 95px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.bottom{display:flex;position:fixed;z-index:5;bottom:0;left:0;right:0;justify-content:space-around;background:#111f33;border-top:1px solid #33455f;padding:9px 3px max(10px,env(safe-area-inset-bottom))}.bottom button{border:0;background:transparent;color:#9fb0ca;font-size:11px;padding:5px 7px}.bottom button.active{color:#7db3ff}.bottom span{display:block;font-size:20px;margin-bottom:3px}.mealgrid{grid-template-columns:65px repeat(7,minmax(95px,1fr))}.top h1{font-size:23px}}@media(max-width:380px){.grid{gap:8px}.card{padding:12px}.kpi{font-size:22px}.formrow{gap:5px}}
</style></head><body><div class="app"><aside class="side"><div class="logo">◈ FITNESS OS</div><nav id="sideNav" class="nav"></nav></aside><main class="main"><div class="top"><h1 id="title">Heute</h1><span class="pill">Fitness OS · Cloud-ready</span></div><div id="view"></div></main></div><nav id="bottomNav" class="bottom"></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="cloud.js"></script><script>
const $=s=>document.querySelector(s), today=()=>new Date().toLocaleDateString('sv-SE'), dateKey=d=>{const x=new Date(d);return x.toLocaleDateString('sv-SE')}, n=v=>Number(v)||0, fmt=v=>Math.round(v).toLocaleString('de-DE'), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const defaults={goals:{mode:'recomp',kcal:2400,p:170,c:250,f:80},weight:[],food:[],exercises:['Bankdrücken','Rudern am Kabel','Schulterdrücken','Kniebeugen','Latzug','Seitheben','Bizepscurls'],templates:[{id:1,name:'Oberkörper A',ex:[{name:'Bankdrücken',sets:3,reps:'8–10',rest:120},{name:'Rudern am Kabel',sets:3,reps:'10–12',rest:90},{name:'Schulterdrücken',sets:3,reps:'8–12',rest:90}]}],sessions:[],plan:{},shopping:[],activity:[],savedMeals:[]};
let db;try{db=JSON.parse(localStorage.getItem('fitness_os_v1'))||structuredClone(defaults)}catch{db=structuredClone(defaults)};for(const k in defaults)if(!(k in db))db[k]=structuredClone(defaults[k]);let route='today',active=null,selDate=today(),selectedTemplate=0,timerEnd=0,timerID=null, timerPaused=0;
function persist(){localStorage.setItem('fitness_os_v1',JSON.stringify(db));cloudMarkDirty()}function uid(){return Date.now()+Math.random()}function navigate(x){route=x;render()}const tabs=[['today','⌂','Heute'],['food','◉','Ernährung'],['training','▣','Training'],['planner','▦','Plan'],['more','☰','Mehr']];
function render(){let title={today:'Heute',food:'Ernährung',training:'Training',planner:'Wochenplan',more:'Mehr',shopping:'Einkaufsliste',progress:'Fortschritt',goals:'Ziele',data:'Daten',activity:'Aktivität'}[route]||'Fitness OS';$('#title').textContent=title;$('#sideNav').innerHTML=[...tabs,...[['shopping','☑','Einkaufsliste'],['recipes','▤','Rezepte'],['progress','↗','Fortschritt'],['goals','◎','Ziele'],['activity','◴','Aktivität'],['data','↓','Backup & Daten']]].map(([id,icon,name])=>`<button class="${route===id?'active':''}" onclick="navigate('${id}')">${icon} &nbsp; ${name}</button>`).join('');$('#bottomNav').innerHTML=tabs.map(([id,icon,name])=>`<button class="${route===id?'active':''}" onclick="navigate('${id}')"><span>${icon}</span>${name}</button>`).join('');let out={today:showToday,food:showFood,training:showTraining,planner:showPlanner,more:showMore,shopping:showShopping,progress:showProgress,goals:showGoals,data:showData,activity:showActivity,recipes:showRecipes}[route];$('#view').innerHTML=out();if(route==='training'&&active)updateTimer()}
function box(label,val,sub){return `<div class="card"><div class="small">${label}</div><div class="kpi">${val}</div><div class="small">${sub||''}</div></div>`}function logs(date=selDate){return db.food.filter(f=>f.date===date)}function totals(date=selDate){return logs(date).reduce((a,x)=>{for(let k of ['kcal','p','c','f'])a[k]+=n(x[k]);return a},{kcal:0,p:0,c:0,f:0})}function progressBar(value,target,type){return `<div class="bar"><div class="fill ${type}" style="width:${Math.min(100,target>0?value/target*100:0)}%"></div></div>`}function macroCard(label,value,target,type){return `<div class="card"><div class="small">${label}</div><div class="kpi">${fmt(value)} <small style="font-size:13px">/ ${fmt(target)} g</small></div>${progressBar(value,target,type)}</div>`}function showToday(){let t=totals(today()),g=db.goals,last=db.weight.at(-1),ses=db.sessions.filter(s=>s.date===today()).length;return `<div class="grid">${box('Kalorien gegessen',fmt(t.kcal),`Ziel ${fmt(g.kcal)} kcal`)}${box('Verbleibend',fmt(g.kcal-t.kcal),'kcal · ohne Aktivitätsverrechnung')}${box('Aktivität heute',fmt(db.activity.filter(x=>x.date===today()).reduce((a,b)=>a+n(b.kcal),0)),'kcal · geschätzt')}${box('Letztes Gewicht',last?`${last.kg} kg`:'–','Messwert')}</div><div class="grid" style="margin-top:14px">${macroCard('Protein',t.p,g.p,'protein')}${macroCard('Kohlenhydrate',t.c,g.c,'carbs')}${macroCard('Fett',t.f,g.f,'fat')}<div class="card"><div class="small">Training heute</div><div class="kpi">${ses}</div><button class="btn" onclick="navigate('training')">Workout öffnen</button></div></div><div class="two"><section class="card"><h2>Schnelle Aktionen</h2><div class="stack"><button class="btn" onclick="navigate('training')">Training starten / fortsetzen</button><button class="btn secondary" onclick="navigate('food')">Mahlzeit erfassen</button><button class="btn secondary" onclick="navigate('planner')">Wochenplan öffnen</button><button class="btn secondary" onclick="navigate('activity')">Aktivität manuell erfassen</button></div></section><section class="card"><h2>Deine heutigen Mahlzeiten</h2>${logs(today()).length?logs(today()).map(x=>`<div class="item row"><span>${esc(x.name)}</span><span class="small">${fmt(x.kcal)} kcal</span></div>`).join(''):'<p class="muted">Noch keine Mahlzeiten erfasst.</p>'}<h3 style="margin-top:18px">Geplant</h3>${['Frühstück','Mittag','Abendessen','Snack'].map(m=>`<div class="item row"><span class="small">${m}</span><span>${esc(db.plan[today()+'|'+m]||'–')}</span></div>`).join('')}</section></div>`}
function showFood(){let t=totals();return `<div class="row" style="margin-bottom:15px"><label>Tag <input type="date" value="${selDate}" onchange="selDate=this.value;render()"></label><span class="pill">${fmt(t.kcal)} / ${fmt(db.goals.kcal)} kcal</span></div><div class="grid">${macroCard('Protein',t.p,db.goals.p,'protein')}${macroCard('Kohlenhydrate',t.c,db.goals.c,'carbs')}${macroCard('Fett',t.f,db.goals.f,'fat')}${box('Kalorien',fmt(t.kcal),`Ziel ${db.goals.kcal}`)}</div><div class="two"><section class="card"><h2>Mahlzeit manuell erfassen</h2><form class="stack" onsubmit="addFood(event)"><label>Name<input name="name" required placeholder="z. B. Skyr mit Beeren"></label><div class="formrow"><label>Protein (g)<input name="p" type="number" min="0" step="0.1" required></label><label>KH (g)<input name="c" type="number" min="0" step="0.1" required></label><label>Fett (g)<input name="f" type="number" min="0" step="0.1" required></label></div><label>Kalorien (kcal)<input name="kcal" type="number" min="0" step="1" required></label><button class="btn">Eintrag speichern</button></form><p class="small">Einträge sind unabhängig von FDDB. Bitte keine Mahlzeit doppelt erfassen.</p></section><section class="card"><h2>Tageslog</h2>${logs().length?logs().map(x=>`<div class="item row"><div><b>${esc(x.name)}</b><div class="small">${fmt(x.kcal)} kcal · P ${x.p} · KH ${x.c} · F ${x.f}</div></div><button class="btn danger" onclick="deleteFood('${x.id}')">✕</button></div>`).join(''):'<p class="muted">Noch keine Einträge an diesem Tag.</p>'}</section></div>`}function addFood(e){e.preventDefault();let x=Object.fromEntries(new FormData(e.target));db.food.push({id:uid(),date:selDate,name:x.name,...Object.fromEntries(['p','c','f','kcal'].map(k=>[k,n(x[k])]))});persist();render()}function deleteFood(id){if(confirm('Eintrag löschen?')){db.food=db.food.filter(x=>String(x.id)!==id);persist();render()}}
function newSession(){const t=db.templates[selectedTemplate];active={id:uid(),date:today(),name:t.name,started:Date.now(),ex:t.ex.map(x=>({...x,rows:Array.from({length:x.sets},()=>({kg:'',reps:'',done:false}))}))};timerEnd=0;render()}function setRow(ei,si,key,value){active.ex[ei].rows[si][key]=value}function finishSet(ei,si){let r=active.ex[ei].rows[si];if(!r.done&&(!n(r.reps)||n(r.kg)<0)){alert('Bitte gültige Wiederholungen und Gewicht eingeben.');return}r.done=!r.done;if(r.done){startRest(active.ex[ei].rest)}render()}function startRest(sec){timerPaused=0;timerEnd=Date.now()+sec*1000;ensureTimer()}function ensureTimer(){if(timerID)clearInterval(timerID);timerID=setInterval(()=>{if(active)updateTimer();else clearInterval(timerID)},500)}function secondsLeft(){return timerEnd?Math.max(0,Math.ceil((timerEnd-Date.now())/1000)):timerPaused}function updateTimer(){let e=$('#timerRead');if(e){let s=secondsLeft();e.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;if(!s&&timerEnd){timerEnd=0;document.title='Pause vorbei · Fitness OS';if(navigator.vibrate)navigator.vibrate([160,100,160])}}}function adjustRest(sec){timerEnd=Date.now()+(Math.max(0,secondsLeft()+sec))*1000;updateTimer()}function pauseRest(){if(timerEnd){timerPaused=secondsLeft();timerEnd=0}else{timerEnd=Date.now()+timerPaused*1000;timerPaused=0}updateTimer()}function stopRest(){timerEnd=0;timerPaused=0;updateTimer()}
function addExercise(){let name=prompt('Name der neuen Übung');if(!name?.trim())return;let sets=3;active.ex.push({name:name.trim(),sets,reps:'8–12',rest:90,rows:Array.from({length:sets},()=>({kg:'',reps:'',done:false}))});render()}function renameExercise(i){let x=prompt('Übungsname',active.ex[i].name);if(x?.trim()){active.ex[i].name=x.trim();render()}}function moveExercise(i,delta){let j=i+delta;if(j<0||j>=active.ex.length)return;[active.ex[i],active.ex[j]]=[active.ex[j],active.ex[i]];render()}function removeExercise(i){if(confirm('Übung aus aktuellem Training entfernen?')){active.ex.splice(i,1);render()}}function addSet(i){active.ex[i].rows.push({kg:'',reps:'',done:false});render()}function delSet(i,j){active.ex[i].rows.splice(j,1);render()}function saveTemplate(){if(!active)return;let t=db.templates.find(x=>x.name===active.name);if(!t){db.templates.push({id:uid(),name:active.name,ex:[]});t=db.templates.at(-1)}t.ex=active.ex.map(e=>({name:e.name,sets:e.rows.length,reps:e.reps,rest:e.rest}));persist();alert('Workout-Vorlage gespeichert.')}function endWorkout(){if(!active)return;if(!active.ex.some(e=>e.rows.some(r=>r.done))&&!confirm('Ohne abgeschlossene Sätze speichern?'))return;db.sessions.push({...active,ended:Date.now()});active=null;stopRest();persist();render()}
function showTraining(){if(!active){return `<div class="two"><section class="card"><h2>Training starten</h2><label>Workout-Vorlage<select onchange="selectedTemplate=Number(this.value)">${db.templates.map((t,i)=>`<option value="${i}" ${i===selectedTemplate?'selected':''}>${esc(t.name)}</option>`).join('')}</select></label><button style="margin-top:14px" class="btn" onclick="newSession()">▶ Workout starten</button><button style="margin:14px 0 0 9px" class="btn secondary" onclick="createTemplate()">+ Vorlage</button></section><section class="card"><h2>Trainingshistorie</h2>${db.sessions.length?db.sessions.slice().reverse().slice(0,12).map(s=>`<div class="item"><b>${esc(s.name)}</b> <span class="small">${s.date}</span><div class="small">${s.ex.reduce((a,e)=>a+e.rows.filter(r=>r.done).length,0)} abgeschlossene Sätze · ${fmt(s.ex.reduce((a,e)=>a+e.rows.reduce((v,r)=>v+(r.done?n(r.kg)*n(r.reps):0),0),0))} kg Volumen</div></div>`).join(''):'<p class="muted">Noch kein Workout gespeichert.</p>'}</section></div>`}let done=active.ex.reduce((a,e)=>a+e.rows.filter(r=>r.done).length,0),total=active.ex.reduce((a,e)=>a+e.rows.length,0);return `<div class="row"><div><span class="pill">● LIVE</span> <b>${esc(active.name)}</b><div class="small" style="margin-top:7px">${done}/${total} Sätze abgeschlossen</div></div><button class="btn" onclick="endWorkout()">Training beenden</button></div><div class="two"><div class="stack"><section class="card"><div class="row"><h2>Übungen</h2><button class="btn secondary" onclick="addExercise()">+ Übung</button></div><p class="small">Alle Übungen lassen sich während des Trainings ändern. Abgeschlossene Sätze bleiben beim Umbenennen erhalten.</p>${active.ex.map((e,i)=>`<details class="item" ${i===0?'open':''}><summary style="cursor:pointer"><b>${esc(e.name)}</b> <span class="small">${e.rows.filter(r=>r.done).length}/${e.rows.length} Sätze</span></summary><div class="row" style="margin:12px 0;flex-wrap:wrap"><button class="btn secondary" onclick="renameExercise(${i})">Umbenennen / tauschen</button><button class="btn secondary" onclick="moveExercise(${i},-1)">↑</button><button class="btn secondary" onclick="moveExercise(${i},1)">↓</button><button class="btn danger" onclick="removeExercise(${i})">Entfernen</button></div><div class="row" style="margin-bottom:12px"><label>Ziel<input value="${esc(e.reps)}" onchange="active.ex[${i}].reps=this.value" style="max-width:110px"></label><label>Pause (s)<input type="number" min="0" value="${e.rest}" onchange="active.ex[${i}].rest=Math.max(0,n(this.value))" style="max-width:110px"></label></div><div class="small setrow"><span>Satz</span><span>kg</span><span>Wdh.</span><span>✓</span></div>${e.rows.map((r,j)=>`<div class="setrow"><div class="row"><span>${j+1}</span><button style="border:0;background:transparent;color:#9fb0ca" onclick="delSet(${i},${j})">×</button></div><input aria-label="Gewicht Satz ${j+1}" type="number" min="0" step="0.5" placeholder="kg" value="${esc(r.kg)}" oninput="setRow(${i},${j},'kg',this.value)"><input aria-label="Wiederholungen Satz ${j+1}" type="number" min="0" step="1" placeholder="Wdh." value="${esc(r.reps)}" oninput="setRow(${i},${j},'reps',this.value)"><button class="btn ${r.done?'secondary':''}" onclick="finishSet(${i},${j})">${r.done?'✓':'○'}</button></div>`).join('')}<button class="btn secondary" onclick="addSet(${i})">+ Satz</button></details>`).join('')}</section></div><div class="stack"><section class="card"><h2>⏱ Pausentimer</h2><div class="kpi" id="timerRead">0:00</div><div class="row"><button class="btn secondary" onclick="adjustRest(-15)">−15 s</button><button class="btn secondary" onclick="pauseRest()">Pause / Start</button><button class="btn secondary" onclick="adjustRest(15)">+15 s</button></div><button class="btn ghost" style="margin-top:11px" onclick="stopRest()">Timer beenden</button></section><section class="card"><h2>Workout anpassen</h2><p class="small">Deine Änderungen gelten zunächst für die aktuelle Einheit. Auf Wunsch kannst du sie dauerhaft als Vorlage sichern.</p><button class="btn secondary" onclick="saveTemplate()">Als Trainingsvorlage speichern</button></section></div></div>`}
function createTemplate(){let name=prompt('Name der neuen Trainingsvorlage');if(!name?.trim())return;db.templates.push({id:uid(),name:name.trim(),ex:[{name:'Neue Übung',sets:3,reps:'8–12',rest:90}]});selectedTemplate=db.templates.length-1;persist();render()}
const DAYS=['So','Mo','Di','Mi','Do','Fr','Sa'],meals=['Frühstück','Mittag','Abendessen','Snack'];function monday(){let d=new Date(selDate+'T12:00:00');d.setDate(d.getDate()-(d.getDay()+6)%7);return d}function showPlanner(){let mon=monday(),dates=Array.from({length:7},(_,i)=>{let d=new Date(mon);d.setDate(mon.getDate()+i);return dateKey(d)});return `<section class="card"><div class="row"><div><h2>Meal Planner</h2><div class="small">Tippe ein Feld an, um das Gericht zu planen. Die Einkaufsliste ist separat bearbeitbar.</div></div><button class="btn secondary" onclick="navigate('shopping')">Einkaufsliste →</button></div><div class="row" style="margin:16px 0"><button class="btn secondary" onclick="shiftWeek(-7)">← Vorwoche</button><label>Woche von<input type="date" value="${selDate}" onchange="selDate=this.value;render()"></label><button class="btn secondary" onclick="shiftWeek(7)">Nächste →</button></div><div style="overflow-x:auto"><div class="mealgrid"><div class="mealhead">Mahlzeit</div>${dates.map(x=>`<div class="mealhead">${DAYS[new Date(x+'T12:00:00').getDay()]} ${x.slice(8)}</div>`).join('')}${meals.map(m=>`<div class="mealhead">${m}</div>${dates.map(d=>`<button class="mealcell" onclick="editPlan('${d}','${m}')">${esc(db.plan[d+'|'+m]||'+ Gericht planen')}</button>`).join('')}`).join('')}</div></div><div class="notice" style="margin-top:16px">Geplante Gerichte werden nicht als gegessen gezählt. Nährwerte erfasst du weiterhin im Ernährungslog. Ein Rezeptmodul mit Zutaten und automatischer Einkaufsliste folgt als nächster Ausbau.</div></section><div class="two"><section class="card"><h2>Trainingsplanung</h2><p class="small">Für Version 1 kannst du Workout-Vorlagen im Training anlegen und während der Einheit bearbeiten. Ein Wochenkalender für Training wird als nächster Schritt ergänzt.</p><button class="btn secondary" onclick="navigate('training')">Workouts öffnen</button></section><section class="card"><h2>Grobe Wochenziele</h2><div class="small">Kalorien pro Tag: ${db.goals.kcal} kcal<br>Protein pro Tag: ${db.goals.p} g<br>Ziel: ${esc(db.goals.mode)}</div><button class="btn secondary" style="margin-top:13px" onclick="navigate('goals')">Ziele ändern</button></section></div>`}function shiftWeek(nDays){let d=new Date(selDate+'T12:00:00');d.setDate(d.getDate()+nDays);selDate=dateKey(d);render()}function editPlan(d,m){let value=prompt(`${m} am ${d} – Gericht`,db.plan[d+'|'+m]||'');if(value===null)return;if(value.trim())db.plan[d+'|'+m]=value.trim();else delete db.plan[d+'|'+m];persist();render()}
function showShopping(){return `<div class="two"><section class="card"><h2>Einkaufsliste</h2><p class="small">Diese MVP-Liste verwaltest du manuell. Automatische Zutaten-Aggregation benötigt später strukturierte Rezepte.</p><form onsubmit="addShopping(event)" class="stack"><label>Artikel / Menge<input name="item" required placeholder="z. B. Skyr 1 kg"></label><button class="btn">+ Hinzufügen</button></form></section><section class="card"><h2>Zu kaufen</h2>${db.shopping.length?db.shopping.map(x=>`<div class="item row"><label style="flex-direction:row;align-items:center"><input type="checkbox" ${x.done?'checked':''} onchange="toggleShopping('${x.id}')"><span style="${x.done?'text-decoration:line-through;opacity:.6':''}">${esc(x.name)}</span></label><button class="btn danger" onclick="removeShopping('${x.id}')">×</button></div>`).join(''):'<p class="muted">Noch keine Artikel erfasst.</p>'}<button class="btn secondary" style="margin-top:12px" onclick="copyShopping()">Liste kopieren</button></section></div>`}function addShopping(e){e.preventDefault();db.shopping.push({id:uid(),name:new FormData(e.target).get('item'),done:false});persist();render()}function toggleShopping(id){db.shopping.find(x=>String(x.id)===id).done=!db.shopping.find(x=>String(x.id)===id).done;persist();render()}function removeShopping(id){db.shopping=db.shopping.filter(x=>String(x.id)!==id);persist();render()}function copyShopping(){let t=db.shopping.filter(x=>!x.done).map(x=>'☐ '+x.name).join('\n');navigator.clipboard?.writeText(t).then(()=>alert('Liste kopiert.'),()=>prompt('Liste kopieren:',t))||prompt('Liste kopieren:',t)}
function showGoals(){return `<section class="card" style="max-width:640px"><h2>Deine Ziele</h2><form class="stack" onsubmit="saveGoals(event)"><label>Zielmodus<select name="mode">${[['recomp','Muskelaufbau + Fettabbau'],['cut','Fettabbau'],['bulk','Muskelaufbau'],['maintain','Gewicht halten']].map(([id,label])=>`<option value="${id}" ${db.goals.mode===id?'selected':''}>${label}</option>`).join('')}</select></label><div class="formrow"><label>Kalorien / Tag<input type="number" name="kcal" min="1" value="${db.goals.kcal}" required></label><label>Protein (g)<input type="number" name="p" min="0" value="${db.goals.p}" required></label><label>KH (g)<input type="number" name="c" min="0" value="${db.goals.c}" required></label></div><label>Fett (g)<input type="number" name="f" min="0" value="${db.goals.f}" required></label><button class="btn">Ziele speichern</button></form><p class="small">Ziele sind frei einstellbar. Die App berechnet noch keine medizinischen oder sportwissenschaftlichen Empfehlungen.</p></section>`}function saveGoals(e){e.preventDefault();db.goals=Object.fromEntries(new FormData(e.target));for(let k of ['kcal','p','c','f'])db.goals[k]=n(db.goals[k]);persist();navigate('today')}
function showActivity(){return `<div class="two"><section class="card"><h2>Aktivität manuell erfassen</h2><form class="stack" onsubmit="addActivity(event)"><label>Datum<input type="date" name="date" value="${today()}" required></label><label>Aktivität<input name="name" required placeholder="z. B. 30 Minuten Radfahren"></label><label>Geschätzte Aktivitätskalorien<input type="number" name="kcal" min="0" required></label><button class="btn">Aktivität speichern</button></form><div class="notice" style="margin-top:12px">Aktivitätskalorien sind Schätzungen und werden nicht automatisch von deinem Essensbudget abgezogen oder daraufgeschlagen.</div></section><section class="card"><h2>Aktivitätslog</h2>${db.activity.slice().reverse().map(x=>`<div class="item row"><span>${esc(x.date)} · ${esc(x.name)} <span class="small">${x.kcal} kcal</span></span><button class="btn danger" onclick="deleteActivity('${x.id}')">×</button></div>`).join('')||'<p class="muted">Noch keine Aktivitäten.</p>'}</section></div>`}function addActivity(e){e.preventDefault();db.activity.push({id:uid(),...Object.fromEntries(new FormData(e.target))});persist();render()}function deleteActivity(id){db.activity=db.activity.filter(x=>String(x.id)!==id);persist();render()}
function showProgress(){let entries=db.weight.slice().sort((a,b)=>a.date.localeCompare(b.date)),max=Math.max(1,...entries.map(x=>n(x.kg)));let t=totals(today());return `<div class="grid">${box('Workouts insgesamt',db.sessions.length,'abgeschlossene Einheiten')}${box('Gewicht aktuell',entries.length?entries.at(-1).kg+' kg':'–','letzte Messung')}${box('Protein heute',fmt(t.p)+' g',`Ziel ${db.goals.p} g`)}${box('Kalorien heute',fmt(t.kcal),`Ziel ${db.goals.kcal}`)}</div><div class="two"><section class="card"><h2>Gewicht dokumentieren</h2><form class="stack" onsubmit="saveWeight(event)"><label>Datum<input type="date" name="date" value="${today()}" required></label><label>Gewicht (kg)<input type="number" min="20" max="400" step="0.1" name="kg" required></label><button class="btn">Messung speichern</button></form></section><section class="card"><h2>Gewichtsverlauf</h2>${entries.length?`<div class="chart">${entries.slice(-14).map(x=>`<div class="chartcol" title="${esc(x.date)}: ${x.kg} kg" style="height:${n(x.kg)/max*100}%"></div>`).join('')}</div><div class="row small"><span>${entries[0].date}</span><span>${entries.at(-1).date}</span></div>`:'<p class="muted">Noch keine Gewichtsdaten.</p>'}${entries.slice().reverse().slice(0,8).map(x=>`<div class="item small">${esc(x.date)} · ${esc(x.kg)} kg</div>`).join('')}</section></div>`}function saveWeight(e){e.preventDefault();let a=Object.fromEntries(new FormData(e.target));db.weight=db.weight.filter(x=>x.date!==a.date);db.weight.push(a);persist();render()}
function showMore(){return `<div class="stack">${[['progress','↗ Fortschritt & Gewicht'],['goals','◎ Ziele ändern'],['shopping','☑ Einkaufsliste'],['activity','◴ Aktivität erfassen'],['data','↓ Backup & Import']].map(([id,label])=>`<button class="btn secondary" style="text-align:left" onclick="navigate('${id}')">${label} →</button>`).join('')}</div>`}
function showData(){return `<div class="two"><section class="card"><h2>Deine Daten sichern</h2><p class="small">Alle Daten liegen nur im lokalen Speicher dieses Browsers. Beim Löschen der Browserdaten können sie verloren gehen. Ein Backup regelmäßig herunterladen.</p><div class="stack"><button class="btn" onclick="exportData()">⬇ JSON-Backup herunterladen</button><label>JSON-Backup einlesen<input type="file" accept="application/json,.json" onchange="importData(event)"></label></div></section><section class="card"><h2>FDDB & Synchronisierung</h2><p>FDDB CSV-Import ist in dieser Version <b>noch nicht implementiert</b>.</p><p>Die geräteübergreifende Synchronisierung funktioniert nach Cloud-Einrichtung und Anmeldung. FDDB wird noch nicht automatisch synchronisiert.</p><p class="small">Garmin, Apple Health, Benutzerkonten und automatische Synchronisierung sind spätere Ausbaustufen.</p></section>${cloudPanel()}<section class="card"><h2>Daten zurücksetzen</h2><button class="btn danger" onclick="resetData()">Alle lokalen Daten löschen</button></section></div>`}function exportData(){const blob=new Blob([JSON.stringify({version:1,exported:new Date().toISOString(),db},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`fitness-os-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}async function importData(e){let f=e.target.files[0];if(!f)return;try{const b=JSON.parse(await f.text());if(!b.db||!Array.isArray(b.db.food)||!Array.isArray(b.db.sessions)||!Array.isArray(b.db.templates))throw Error('Ungültiges Backup');if(!confirm('Vorhandene lokale Daten durch dieses Backup ersetzen?'))return;db=b.db;for(const k in defaults)if(!(k in db))db[k]=structuredClone(defaults[k]);persist();render();alert('Backup importiert.')}catch(err){alert('Import fehlgeschlagen: '+err.message)}}function resetData(){if(confirm('Alle lokalen Einträge endgültig löschen? Vorher ein Backup erstellen.')){db=structuredClone(defaults);active=null;persist();render()}}
</script><script src="off_extension.js"></script><script src="weekly_ai_planner.js"></script><script src="quick_food.js"></script><script src="own_food.js"></script><script>render();cloudInit();</script></body></html>
